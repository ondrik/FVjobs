name: weekly link check

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check every posting URL
        id: check
        run: |
          set +e
          python3 scripts/linkcheck.py > report.md 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md
      - name: Open an issue when links fail
        if: steps.check.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const title = `Link check failed (${new Date().toISOString().slice(0,10)})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['stale'],
              body: "The weekly link check found postings that no longer resolve. "
                  + "Move closed roles to `data/archive.yml` with a `closed` date.\n\n"
                  + "```\n" + body.slice(0, 50000) + "\n```",
            });
